        html{

        h1{

        body{

            justify-content: center;

        .upper{

        #add{

            padding: 2.5rem;
            border-radius: 2.5rem;
            word-break: break-word;
            flex-grow: 1;
            
    

        }
        .left{

        }

            border-color: black;

        #add {
        background-color: white;
        color: black;
        border-radius: 50%;            /* Make it a circle */
        width: 3.5rem;
        height: 3.5rem;
        font-size: 1.8rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        border: none;
        transition: background-color 0.3s;
        font-size: 3rem;
        padding: 3rem;
        }

        #add:hover {
            background-color: rgb(255, 116, 139);
            color: rgb(0, 0, 0);
            box-shadow: 0 0 7rem rgb(255, 116, 139);
        }

        
        .btn:hover{
            background-color: #054c09;
            color: white;
            box-shadow: 0 0 70px #054c09;
        }
        .btn{
            background-color: #4CAF50;   /* green */
            color: white;
            border: none;
            border-radius: 50%;          /* make it a circle */
            width: 3rem;
            height: 3rem;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.3s;
            
        }
        .header{
            text-align: center;
            font-size: 2.5rem;
            color: white;
            font-family:Verdana, Geneva, Tahoma, sans-serif
          
            
        }
        
        @media screen and (max-width:360px){
            .upper {
                flex-direction: column;
                gap: 1rem;
            }

            #value{
                width: 100%;
                box-sizing: border-box;
            }

            .sample {
                flex-direction: column;
                align-items: flex-start;
            }

            .right {
                align-self: flex-end;
            }
                    
        }
        .buttons{
            display: flex;
            justify-content: space-evenly;
